version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all minor/patch bumps; majors still get their own PR.
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
